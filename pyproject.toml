[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "emburden-data"
version = "0.1.0"
description = "Pure-Python data access to the emburden global household energy-burden dataset (no R install required)"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
  {name = "Eric Scheier", email = "hello@emrgi.com"}
]
keywords = [
  "energy", "energy-poverty", "climate-justice",
  "household-energy", "open-data", "pandas"
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering",
  "Topic :: Scientific/Engineering :: GIS",
  "Topic :: Scientific/Engineering :: Information Analysis"
]
dependencies = [
  "pandas>=1.5",
  "pyarrow>=10",
  "requests>=2.28",
  "PyYAML>=6",
  "platformdirs>=3"
]

[project.optional-dependencies]
geo = [
  "geopandas>=0.13",
  "shapely>=2"
]
dev = [
  "pytest>=7",
  "pytest-cov>=4",
  "ruff>=0.5",
  "build>=1",
  "twine>=5"
]

[project.urls]
Homepage      = "https://emburden.org"
Documentation = "https://emburden.org/data.html"
Repository    = "https://github.com/ericscheier/emburden-data"
"Bug Tracker" = "https://github.com/ericscheier/emburden-data/issues"
"R ecosystem" = "https://github.com/ericscheier"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
emburden_data = ["*.yml", "*.yaml", "manifests/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100
target-version = "py39"
